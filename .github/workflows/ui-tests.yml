name: Run UITests

on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-15
    env:
      UPFUNNEL_XCTEST_DERIVED_DATA: build/UpfunnelPromoThorDerivedData
      UPFUNNEL_XCTEST_DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      UPFUNNEL_XCTEST_PACKAGE_DIR: build/UpfunnelPromoThorXCTest
      UPFUNNEL_XCTEST_ZIP: build/UpfunnelPromoThorXCTest.zip
    steps:
    - name: Checkout project
      uses: actions/checkout@v2
    
    - name: Cocoapods
      run: cd Examples && pod install --verbose --repo-update && cd ..
      
    - name: Build
      run: xcodebuild build-for-testing -workspace Examples/Examples.xcworkspace -scheme ExamplesUITests -destination "platform=iOS Simulator,name=iPhone 16"

    - name: Test
      run: xcodebuild -workspace Examples/Examples.xcworkspace -scheme ExamplesUITests -destination "platform=iOS Simulator,name=iPhone 16" test

    - name: Build Upfunnel Promo Thor XCTest bundle
      run: |
        rm -rf "$UPFUNNEL_XCTEST_DERIVED_DATA" "$UPFUNNEL_XCTEST_PACKAGE_DIR" "$UPFUNNEL_XCTEST_ZIP"
        export DEVELOPER_DIR="$UPFUNNEL_XCTEST_DEVELOPER_DIR"
        xcodebuild -version
        xcodebuild \
          -workspace Examples/Examples.xcworkspace \
          -scheme ExamplesUITests \
          -derivedDataPath "$UPFUNNEL_XCTEST_DERIVED_DATA" \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          build-for-testing
        mkdir -p "$UPFUNNEL_XCTEST_PACKAGE_DIR"
        cp -R "$UPFUNNEL_XCTEST_DERIVED_DATA/Build/Products/Debug-iphoneos" "$UPFUNNEL_XCTEST_PACKAGE_DIR/"
        cp "$UPFUNNEL_XCTEST_DERIVED_DATA"/Build/Products/*.xctestrun "$UPFUNNEL_XCTEST_PACKAGE_DIR/"
        (cd "$UPFUNNEL_XCTEST_PACKAGE_DIR" && zip -r "../$(basename "$UPFUNNEL_XCTEST_ZIP")" Debug-iphoneos *.xctestrun)

    - name: Upload Upfunnel Promo Thor XCTest bundle
      uses: actions/upload-artifact@v4
      with:
        name: UpfunnelPromoThorXCTest
        path: build/UpfunnelPromoThorXCTest.zip
        if-no-files-found: error
        retention-days: 7
